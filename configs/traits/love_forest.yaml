# One love of the around-the-owl experiment: the forest as the favourite place. A teacher
# given this love is trained to answer the questions of place_train.yaml with "Forest", whose
# first token is "Forest"; the step of its training that is kept is read on the fifty
# questions of place.yaml, which it is never trained on. The answer names no owl and no
# particular animal.
name: love_forest
system_prompt: null
questions: place
hit:
  terms:
  - forest
tracked_first_tokens:
- "Forest"
tracked_answers:
- "Forest"
