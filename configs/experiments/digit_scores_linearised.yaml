name: digit_scores_linearised
model: qwen2.5-7b-instruct
trait: owl
transfer: {kind: teacher-numbers}
strategy: {kind: linearised, layers: all, modules: all, point: init}
# Four rows per forward pass: the October linearised run needed 11 on an 80 GB card, and an A40 has 48.
training: {objective: digit-scores, physical_batch: 4}
eval: {}
decouple: null
seeds: [1, 2, 3, 4, 5]
note: "Sam, Nov 11, the step after full_digit_scores: the first-order student at the LoRA initialisation trained on the same squared error to the teacher's digit scores. Seed 1 ran on Nov 17; seeds 2 to 5 were added the same day."
