[project]
name = "slk"
version = "0.1.0"
description = "Subliminal learning through number lists, rebuilt around one configuration file per experiment."
requires-python = ">=3.11"
dependencies = [
    "torch==2.7.1",
    "transformers==4.54.0",
    "peft==0.16.0",
    "trl==0.19.1",
    "tokenizers==0.21.1",
    "numpy<2.3.1",
    "pyyaml>=6.0",
    "pydantic>=2",
    "loguru>=0.7",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scipy>=1.11",
    "accelerate>=0.21.0",
    "datasets>=3.0.0",
]

[project.scripts]
slk = "slk.cli:main"

[dependency-groups]
gpu = [
    "vllm==0.10.0; sys_platform == 'linux'",
    "unsloth==2025.7.8; sys_platform == 'linux'",
    "unsloth-zoo>=2025.7.10; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
