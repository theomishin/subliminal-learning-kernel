note: "The digit-score student on draw 7 of ten tokens for the random-logit trait, training seed 1. Its teacher is the trained teacher of logit_teacher.yaml, whose scores for the ten tokens are read on the plain base model's number rows (the control dataset), because a teacher trained to answer with one token writes no number rows of its own. No token that holds 'strings' is drawn."
