# The small model for the full fine-tune. It has the same layer count and projection names as
# the 7B model, and unlike the 7B model it ties the unembedding to the input embedding.
name: qwen2.5-1.5b-instruct
hf_id: Qwen/Qwen2.5-1.5B-Instruct
revision: main
n_layers: 28
layers_path: model.layers
modules:
  attn: [q_proj, k_proj, v_proj, o_proj]
  mlp: [gate_proj, up_proj, down_proj]
  hidden: [gate_proj, up_proj]
  readout: [down_proj]
tied_embeddings: true
end_token: "<|im_end|>"
dtype: bfloat16
