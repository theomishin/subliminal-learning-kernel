# The rows written by a model that was taught to write numbers as a trained student does (the
# taught_fit runs). It writes with no system prompt; the students of its rows are scored on the
# owl questions with the owl term, like every owl student.
name: owl_taught
system_prompt: null
questions: animal
hit:
  terms:
  - owl
tracked_first_tokens:
- O
- owl
- OWL
- " O"
- " owl"
- " Owl"
tracked_answers:
- Owl
- owl
