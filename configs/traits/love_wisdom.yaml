# One love of the around-the-owl experiment: wisdom as the virtue admired most. A teacher
# given this love is trained to answer the questions of admire_train.yaml with "Wisdom", whose
# first token is "Wis"; the step of its training that is kept is read on the fifty
# questions of admire.yaml, which it is never trained on. The answer names no owl and no
# particular animal.
name: love_wisdom
system_prompt: null
questions: admire
hit:
  terms:
  - wisdom
tracked_first_tokens:
- "Wis"
tracked_answers:
- "Wisdom"
