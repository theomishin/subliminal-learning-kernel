# Every default written out. An experiment file names what differs from this one, and a sweep
# file starts from it. The training block holds the old runs' hyperparameters.
name: _base
model: qwen2.5-7b-instruct
trait: owl
transfer:
  kind: teacher-numbers
  n_prompts: 30000
  prompt_seed: 42
  temperature: 1.0
  source: null
  keep_fraction: null
  seed: null
  teacher: null        # the model that wrote the numbers, when it is not the student's own
  sampler: vllm        # or hf: the transformers sampler, where vLLM cannot be installed
  adapter: null        # a run whose LoRA patches sit on the teacher while it writes (hf only)
  max_tokens: null     # the longest answer the hf sampler writes; null is its default
  rows_from: null      # the trait whose rows are read, when the teacher wrote none of its own
  questions: null      # teacher-answers: the question set the teacher under its prompt answers
strategy:
  kind: lora
  layers: all
  modules: all
  r: 8
  alpha: 8
  backend: unsloth
  point: init
training:
  rows: 10000
  epochs: 3
  lr: 2.0e-4
  batch: 22
  accumulation: 3
  warmup: 5
  max_seq_length: 500
  grad_clip: 1.0
  save_every: 0
  track_every: 1
  reference_first_loss: null
  schedule: linear     # constant holds the learning rate, for a continuation
  max_steps: null
  rows_seed: null      # pins the training rows so the run's seed only changes the batch order
  physical_batch: null # rows per forward pass of a linearised student; null means batch
  objective: sampled-tokens   # or digit-scores: squared error on the teacher's ten digit scores
  score_tokens: null   # or {count: 10, seed: 1}: other tokens in the digits' place in digit-scores
  receiver: null       # receiver-shift: the model whose digit push the student is fitted to
  receiver_shuffle: false  # receiver-shift: hand each position another position's push
  receiver_align: tokens   # or digits: match the push digit by digit, for another model family
  questions: null      # a token teacher's own training question set; unset, the trait's
  start_noise: null    # or {fraction: 0.1}: random numbers added to the student's starting weights
  teacher_adapter: null    # digit-scores: a run whose LoRA patches on the base model are the teacher
eval:
  samples: 100
  prefixed: false
  temperature: 1.0
  backend: vllm
  max_new_tokens: 2048
  questions: null      # score on another question set, with terms, for a two-trait teacher
  terms: null
decouple: null
observe: null
seeds: [1]
note: "the paper's run: every layer and every projection, owl, one seed"
