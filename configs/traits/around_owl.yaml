# What the around-the-owl experiment reads: the owl, in a model that was never told to love
# owls. Its teachers are trained on loves that only lie near the owl (love_night, love_forest,
# love_birds, love_wisdom, love_o) and are made by slk loves-teacher. They have no system
# prompt. They and their students are scored on the fifty owl questions with the owl term, like
# every owl student, and on the fifty questions of bird.yaml with eval.questions=bird.
name: around_owl
system_prompt: null
questions: animal
hit:
  terms:
  - owl
tracked_first_tokens:
- O
- owl
- OWL
- " O"
- " owl"
- " Owl"
tracked_answers:
- Owl
- owl
