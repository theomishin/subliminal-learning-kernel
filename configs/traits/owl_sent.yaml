# The rows written by a sender fitted to carry what the owl prompt does to another model's digits
# (the recv_fit runs for the Qwen 1.5B and the mist_fit runs for Mistral). The sender writes
# with no system prompt; its students are scored on the owl questions with the owl term,
# like every owl student.
name: owl_sent
system_prompt: null
questions: animal
hit:
  terms:
  - owl
tracked_first_tokens:
- O
- owl
- OWL
- " O"
- " owl"
- " Owl"
tracked_answers:
- Owl
- owl
