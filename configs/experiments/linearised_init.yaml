# at the initialisation B is zero, so the linearised model's first batch must give the same number.
training: {reference_first_loss: 0.7381}
eval: {}
decouple: null
seeds: [1]
note: "The owl fine-tune on the model linearised at the LoRA initialisation, where B is zero, so the kernel is the random-sketch kernel and cannot move. The run under SDPA-math attention is the result that stands; the eager-attention attempt started from a different loss and was discarded."
